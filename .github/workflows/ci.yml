name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Exact source ref/SHA to test (empty uses the triggering ref)
        type: string
        default: ""
      no-cache:
        description: Build without restoring Cargo caches for release/deploy
        type: boolean
        default: false
    outputs:
      web-artifact:
        description: Tested Trunk dist artifact within this workflow run
        value: ${{ jobs.web.outputs.artifact-name }}
      source-sha:
        description: Commit used for the web build and browser tests
        value: ${{ jobs.web.outputs.source-sha }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.97.1"
  TRUNK_VERSION: "0.22.2"
  # Upstream v0.22.2 x86_64-unknown-linux-gnu asset and its .sha256 agree.
  TRUNK_SHA256: 26fca8a9952e46cd7d8b8b9a2e2c1786c090fc14b8e10b6678ab4d0f9f1a385f
  WASM_BROTLI_BUDGET_KIB: "450"

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown --no-self-update
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !inputs.no-cache }}
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Security check (no exposed secrets/IDs/paths)
        shell: pwsh
        run: ./scripts/security-check.ps1
      - name: Format
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - name: Native shared and worker unit tests
        run: cargo test -p flood-shared -p flood-worker --locked
      - name: Clippy shared and worker (wasm32)
        run: cargo clippy -p flood-shared -p flood-worker --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Check web (wasm32)
        run: cargo check -p flood-web --target wasm32-unknown-unknown --locked

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact-name: ${{ steps.metadata.outputs.artifact-name }}
      source-sha: ${{ steps.metadata.outputs.source-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: metadata
        run: |
          echo "artifact-name=flood-web-dist" >> "$GITHUB_OUTPUT"
          echo "source-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown --no-self-update
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !inputs.no-cache }}
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install checksum-verified Trunk
        run: |
          archive="$RUNNER_TEMP/trunk.tar.gz"
          curl --fail --location --retry 3 "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" -o "$archive"
          printf '%s  %s\n' "$TRUNK_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/trunk-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/trunk-bin" trunk
          test "$("$RUNNER_TEMP/trunk-bin/trunk" --version)" = "trunk ${TRUNK_VERSION}"
          echo "$RUNNER_TEMP/trunk-bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
          package-manager-cache: false
      - name: Install locked browser-test dependencies
        run: npm ci
      - name: Release frontend build
        working-directory: crates/flood-web
        run: trunk build --release --locked
      - name: Record builder provenance before testing
        run: python3 scripts/package_release.py --record-build --dist crates/flood-web/dist
      - name: WASM Brotli quality-11 budget
        run: node scripts/check_wasm_size.mjs --dist crates/flood-web/dist --budget-kib "$WASM_BROTLI_BUDGET_KIB"
      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium
      - name: Snapshot tested assets
        working-directory: crates/flood-web/dist
        run: find . -type f ! -name .trunk-lock -print0 | sort -z | xargs -0 -r sha256sum > "$RUNNER_TEMP/dist-before-tests.sha256"
      - name: Browser smoke tests (local synthetic API only)
        run: npm run test:e2e
      - name: Verify tests did not change packaged assets
        working-directory: crates/flood-web/dist
        run: |
          sha256sum --check --strict "$RUNNER_TEMP/dist-before-tests.sha256"
          find . -type f ! -name .trunk-lock -print0 | sort -z | xargs -0 -r sha256sum > "$RUNNER_TEMP/dist-after-tests.sha256"
          cmp "$RUNNER_TEMP/dist-before-tests.sha256" "$RUNNER_TEMP/dist-after-tests.sha256"
      - name: Check release layout and static assets
        run: python3 scripts/package_release.py --check-only --rev HEAD --dist crates/flood-web/dist
      - name: Archive tested web build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flood-web-dist
          path: |
            crates/flood-web/dist/
            !crates/flood-web/dist/.trunk-lock
            !crates/flood-web/dist/.stage/**
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            tests/e2e/results/
            tests/e2e/report/
            tests/e2e/test-results/
            tests/e2e/playwright-report/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

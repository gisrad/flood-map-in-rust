[workspace]
resolver = "2"
members = [
  "crates/flood-shared",
  "crates/flood-worker",
  "crates/flood-web",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/gisrad/flood-map-in-rust"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

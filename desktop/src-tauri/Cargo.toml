[package]
name = "hidrosentinel-desktop"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Thin desktop client (Tauri 2) for https://flood.transbulent.id"
repository = "https://github.com/gisrad/flood-map-in-rust"
publish = false

# Separate workspace: Tauri and its native dependencies stay out of the web/worker build,
# its Cargo.lock and the web release license inventory.
[workspace]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
